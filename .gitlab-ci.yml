# audit-helper CI
# 이 파일이 있으면 GitLab은 Auto DevOps 대신 이 파이프라인을 사용한다.
# 이 프로젝트는 순수 Python 수집·태깅 파이프라인 + 정적 JSON 데이터라
# "빌드할 앱"이 없다. 따라서 build/deploy 대신
#   (1) Python 문법 검사, (2) 스키마·절대규칙 게이트(pipeline/validate.py)
# 만 수행한다. 실데이터(data/findings.json)는 커밋되지 않으므로
# 게이트는 커밋된 합성 픽스처(data/findings.sample.json)를 검사한다.

# 실행할 러너(runner)가 없으면 파이프라인이 '대기중(pending/stalled)'으로 계속 남는다.
# 이 저장소(aigov)는 기록·수집 작업용이라 상시 CI가 필요 없으므로,
# 기본적으로 파이프라인을 생성하지 않는다(→ 노란불 안 생김).
# CI를 돌리고 싶을 땐(러너가 준비된 뒤) 파이프라인 실행 시 변수 RUN_CI=true 를 주면 된다.
#   예: CI/CD → Run pipeline → Variable  RUN_CI = true
workflow:
  rules:
    - if: '$RUN_CI == "true"'
    - when: never

default:
  image: python:3.12-slim

stages:
  - validate

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# (1) 파이프라인/스크립트 파일 문법 검사 — 구문 오류·깨진 모듈 조기 탐지
syntax:
  stage: validate
  script:
    - python -m compileall -q pipeline scripts

# (2) 데이터 품질 게이트 — G1(스키마) + G2(절대규칙)
#     schema/finding.schema.json 적합 + id 중복 없음 + 출처링크·현행성 규칙
schema-gate:
  stage: validate
  script:
    - pip install --no-cache-dir "jsonschema>=4.0"
    - python -c "import json; json.load(open('schema/finding.schema.json', encoding='utf-8')); print('schema json ok')"
    - python pipeline/validate.py data/findings.sample.json
