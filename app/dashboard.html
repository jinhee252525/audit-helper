<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>인사이트 — 감사 선례 도우미</title>
<link rel="stylesheet" href="./styles.css" />
<style>
/* Insight dashboard — sage mockup layout; no blue / HITL chrome */
.page-insight {
  background: var(--page);
  color: var(--ink);
  min-height: 100vh;
}
.insight-wrap {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
  padding: 20px 0 48px;
}
.insight-head {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--shadow);
}
.insight-head .brand {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-decoration: none;
}
.insight-nav {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.insight-nav a {
  font-size: 0.88rem;
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
}
.insight-nav a:hover { color: var(--deep); }
.insight-nav a[aria-current="page"] {
  color: var(--muted);
  font-weight: 650;
}
.insight-nav .nav-more {
  font-size: 0.78rem;
  font-weight: 500;
  opacity: 0.85;
}

/* Hero: 이번 주 시선 */
.week-hero {
  margin-top: 16px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  box-shadow: var(--shadow);
  min-height: 110px;
}
.week-hero .accent {
  width: 8px;
  flex-shrink: 0;
  background: var(--deep);
}
.week-hero .hero-body {
  flex: 1;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.week-hero .eyebrow {
  margin: 0 0 6px;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: -0.01em;
}
.week-hero .summary {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.45;
  max-width: 36ch;
}
.metric-card {
  background: var(--sage-soft);
  border-radius: 12px;
  padding: 14px 22px;
  text-align: center;
  min-width: 120px;
}
.metric-card .m-label {
  font-size: 0.75rem;
  font-weight: 650;
  color: var(--deep);
}
.metric-card .m-val {
  margin-top: 2px;
  font-size: 2.1rem;
  font-weight: 800;
  color: var(--deep);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

/* Two columns */
.insight-cols {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 820px) {
  .insight-cols { grid-template-columns: 1fr; }
}
.insight-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px 20px;
  box-shadow: var(--shadow);
}
.insight-card h2 {
  margin: 0 0 14px;
  font-size: 0.98rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.insight-card .card-note {
  margin: -6px 0 12px;
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.45;
}

/* Vertical bar chart */
.vbars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  height: 180px;
  padding: 0 4px 0;
}
.vbar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  min-width: 0;
}
.vbar-track {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.vbar-fill {
  width: 72%;
  max-width: 42px;
  border-radius: 8px 8px 4px 4px;
  min-height: 4px;
  transition: height 0.25s ease;
}
.vbar-label {
  margin-top: 8px;
  font-size: 0.72rem;
  font-weight: 650;
  color: var(--ink);
  text-align: center;
  white-space: nowrap;
}
.vbar-n {
  font-size: 0.65rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* Quality tall cards */
.q-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  min-height: 180px;
}
.q-pill {
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 8px;
  text-align: center;
}
.q-pill .q-lab {
  font-size: 0.82rem;
  font-weight: 700;
}
.q-pill .q-pct {
  font-size: 1.85rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.q-list {
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--border);
}
.q-body {
  background: var(--primary);
  color: #f4f7f5;
}
.q-matched {
  background: var(--deep);
  color: #f4f7f5;
}

/* Recent body secured */
.recent-card {
  margin-top: 16px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px 16px;
  box-shadow: var(--shadow);
}
.recent-card h2 {
  margin: 0 0 14px;
  font-size: 0.98rem;
  font-weight: 700;
}
.recent-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.recent-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--tip);
  border-radius: 12px;
  padding: 14px 18px;
  flex-wrap: wrap;
}
.recent-row .r-title {
  flex: 1;
  min-width: 140px;
  font-weight: 650;
  font-size: 0.92rem;
  color: var(--ink);
}
.recent-row .r-status {
  font-size: 0.82rem;
  font-weight: 650;
  color: var(--deep);
  white-space: nowrap;
}
.recent-row .r-open {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--primary);
  text-decoration: none;
  white-space: nowrap;
}
.recent-row .r-open:hover { color: var(--deep); }
.recent-row .r-open[aria-disabled="true"] {
  color: var(--muted);
  pointer-events: none;
  font-weight: 600;
}

.insight-foot {
  margin-top: 20px;
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 1.5;
}
.insight-foot code {
  background: var(--sage-soft);
  color: var(--deep);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.68rem;
}
.insight-empty {
  color: var(--muted);
  text-align: center;
  padding: 28px 8px;
  font-size: 0.88rem;
}
</style>
</head>
<body class="page-insight">
  <div class="insight-wrap">
    <header class="insight-head">
      <a class="brand" href="./index.html">감사 선례 도우미</a>
      <nav class="insight-nav" aria-label="주요 메뉴">
        <a href="./dashboard.html" aria-current="page">인사이트</a>
        <a class="nav-more" href="./index.html">상황</a>
        <a class="nav-more" href="./status.html">현황</a>
        <a class="nav-more" href="./search.html">검색</a>
      </nav>
    </header>

    <section class="week-hero" aria-labelledby="weekTitle">
      <div class="accent" aria-hidden="true"></div>
      <div class="hero-body">
        <div>
          <p class="eyebrow" id="weekTitle">이번 주 시선</p>
          <p class="summary" id="weekSummary">집계를 불러오는 중…</p>
        </div>
        <div class="metric-card" title="본문이 있는 건 비율(인덱스 품질 집계)">
          <div class="m-label">본문 확보율</div>
          <div class="m-val" id="bodyRate">—</div>
        </div>
      </div>
    </section>

    <div class="insight-cols">
      <section class="insight-card" aria-labelledby="workDistTitle">
        <h2 id="workDistTitle">업무유형 분포</h2>
        <p class="card-note" id="workNote"></p>
        <div class="vbars" id="workBars" role="img" aria-label="업무유형별 건수 막대"></div>
      </section>

      <section class="insight-card" aria-labelledby="qualityTitle">
        <h2 id="qualityTitle">근거 품질 구성</h2>
        <p class="card-note" id="qualityNote"></p>
        <div class="q-row" id="qualityRow">
          <div class="q-pill q-list"><span class="q-lab">목록만</span><span class="q-pct" id="qList">—</span></div>
          <div class="q-pill q-body"><span class="q-lab">본문 확보</span><span class="q-pct" id="qBody">—</span></div>
          <div class="q-pill q-matched"><span class="q-lab">근거 대조</span><span class="q-pct" id="qMatched">—</span></div>
        </div>
      </section>
    </div>

    <section class="recent-card" aria-labelledby="recentTitle">
      <h2 id="recentTitle">최근 본문 확보</h2>
      <ul class="recent-list" id="recentList">
        <li class="insight-empty">불러오는 중…</li>
      </ul>
    </section>

    <p class="insight-foot" id="footMeta"></p>
  </div>

<script>
"use strict";
(function () {
  const $ = (s) => document.querySelector(s);
  const BAR_COLORS = ["#3F5D50", "#4A6B5E", "#5B7C73", "#6F9085", "#8DA399", "#A3B5AC"];
  const BUCKETS = [
    { key: "계약", codes: ["02"] },
    { key: "예산", codes: ["17"] },
    { key: "인사", codes: ["11"] },
    { key: "보조금", codes: ["15"], tip: "코드 15 지원·보상" },
    { key: "정보화", codes: ["23"] },
    { key: "기타", codes: null },
  ];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function pct(n, d) {
    if (!d) return null;
    return Math.round((1000 * n) / d) / 10; // one decimal, then display as int if .0
  }

  function fmtPct(p) {
    if (p == null || Number.isNaN(p)) return "—";
    const r = Math.round(p);
    return r + "%";
  }

  function shortTitle(rec) {
    const ex = (rec.source_excerpt || "").replace(/\s+/g, " ").trim();
    if (ex) {
      const line = ex.split(/[.\n\r]/)[0].replace(/^[○●■□\-–—\s]+/, "").trim();
      if (line.length >= 4) return line.length > 28 ? line.slice(0, 28) + "…" : line;
    }
    const parts = [rec.org_name, rec.disposition].filter(Boolean);
    return parts.join(" · ") || rec.id || "사례";
  }

  function workBuckets(agg) {
    const wt = Object.fromEntries(agg.work_type || []);
    const used = new Set();
    const rows = [];
    for (const b of BUCKETS) {
      if (!b.codes) continue;
      let n = 0;
      for (const c of b.codes) {
        n += wt[c] || 0;
        used.add(c);
      }
      rows.push({ key: b.key, n, tip: b.tip || (agg.labels && agg.labels.work && b.codes[0] ? agg.labels.work[b.codes[0]] : "") });
    }
    let other = 0;
    for (const [c, v] of Object.entries(wt)) {
      if (!used.has(c)) other += v;
    }
    rows.push({ key: "기타", n: other, tip: "위 다섯 유형 외 합" });
    return rows;
  }

  function renderBars(rows) {
    const max = Math.max(...rows.map((r) => r.n), 1);
    const el = $("#workBars");
    el.innerHTML = rows
      .map((r, i) => {
        const h = Math.max(4, Math.round((r.n / max) * 150));
        const tip = r.tip ? ` title="${esc(r.tip)}: ${r.n.toLocaleString()}건"` : ` title="${r.n.toLocaleString()}건"`;
        return `<div class="vbar-col"${tip}>
          <div class="vbar-track"><div class="vbar-fill" style="height:${h}px;background:${BAR_COLORS[i % BAR_COLORS.length]}"></div></div>
          <div class="vbar-label">${esc(r.key)}</div>
          <div class="vbar-n">${r.n.toLocaleString()}</div>
        </div>`;
      })
      .join("");
  }

  function applyQuality(q, n, note) {
    const list = q.list_only != null ? q.list_only : Math.max(0, n - (q.body || 0) - (q.matched || 0));
    const body = q.body || 0;
    const matched = q.matched || 0;
    const pList = pct(list, n);
    const pBody = pct(body, n);
    const pMatched = pct(matched, n);
    $("#qList").textContent = fmtPct(pList);
    $("#qBody").textContent = fmtPct(pBody);
    $("#qMatched").textContent = fmtPct(pMatched);
    $("#bodyRate").textContent = fmtPct(pBody);
    $("#qualityNote").textContent = note || "";
    return { pBody, pList, pMatched, body, list, matched };
  }

  function heroSummary(agg, qualityInfo) {
    const rows = workBuckets(agg);
    const top = rows.slice().sort((a, b) => b.n - a.n)[0];
    const bodyPct = qualityInfo && qualityInfo.pBody != null ? Math.round(qualityInfo.pBody) : null;
    if (top && top.n > 0) {
      if (bodyPct != null) {
        return `${top.key} 업무 선례가 집계에서 가장 많습니다. 본문 확보율은 ${bodyPct}%입니다.`;
      }
      return `${top.key} 업무 선례가 집계에서 가장 많습니다.`;
    }
    if (agg.insight) return agg.insight;
    return "집계 데이터를 표시합니다.";
  }

  function renderRecent(samples) {
    const withBody = (samples || []).filter((r) => (r.source_excerpt || "").trim());
    const pick = withBody.slice(0, 3);
    const el = $("#recentList");
    if (!pick.length) {
      el.innerHTML = '<li class="insight-empty">본문 발췌가 있는 샘플이 없습니다.</li>';
      return;
    }
    el.innerHTML = pick
      .map((r) => {
        const url = (r.source_url || "").trim();
        const open = url
          ? `<a class="r-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">열기</a>`
          : `<span class="r-open" aria-disabled="true">열기</span>`;
        return `<li class="recent-row">
          <span class="r-title">${esc(shortTitle(r))}</span>
          <span class="r-status">본문 확보</span>
          ${open}
        </li>`;
      })
      .join("");
  }

  function render(agg, qualityPayload) {
    const rows = workBuckets(agg);
    renderBars(rows);
    $("#workNote").textContent =
      `집계본 ${agg.total.toLocaleString()}건 · ${esc(agg.generated_at || "")} · 보조금=지원·보상(15)`;

    let qInfo = null;
    if (qualityPayload && qualityPayload.quality && qualityPayload.n_docs) {
      const q = Object.assign({}, qualityPayload.quality);
      if (q.list_only == null) {
        q.list_only = Math.max(0, qualityPayload.n_docs - (q.body || 0) - (q.matched || 0));
      }
      qInfo = applyQuality(
        q,
        qualityPayload.n_docs,
        `인덱스 품질 집계 N=${qualityPayload.n_docs.toLocaleString()} · 목록만/본문/근거대조(matched)`
      );
      if (qualityPayload.insight) {
        // keep computed hero; insight is advisory in foot
      }
    } else {
      // Honest fallback from sample_records only — do not invent corpus-wide %
      const samples = agg.sample_records || [];
      let list = 0, body = 0;
      for (const r of samples) {
        const ex = (r.source_excerpt || "").trim();
        if (!ex) list++;
        else body++;
      }
      if (samples.length) {
        qInfo = applyQuality(
          { list_only: list, body, matched: 0 },
          samples.length,
          `품질 전체 집계 없음 — 샘플 ${samples.length}건·발췌 유무만 분류(근거 대조는 인덱스 집계 필요)`
        );
      } else {
        $("#qualityNote").textContent = "품질 집계 파일이 없어 비율을 표시하지 않습니다.";
      }
    }

    $("#weekSummary").textContent = heroSummary(agg, qInfo);
    renderRecent(agg.sample_records);

    const bits = [
      `대시보드 집계: <code>dashboard-agg.json</code> ${agg.total.toLocaleString()}건`,
      agg.source_file ? `원본 ${esc(agg.source_file)}` : "",
      qualityPayload ? `품질: <code>insight-quality.json</code> / index` : "품질: 샘플 폴백",
      "판단·처분은 담당자 몫입니다.",
    ].filter(Boolean);
    $("#footMeta").innerHTML = bits.join(" · ");
  }

  function loadJson(url) {
    return fetch(url).then((r) => {
      if (!r.ok) throw new Error(url + " " + r.status);
      return r.json();
    });
  }

  Promise.all([
    loadJson("./data/dashboard-agg.json"),
    loadJson("./data/insight-quality.json").catch(() =>
      loadJson("./data/index/dashboard-agg.json").catch(() => null)
    ),
  ])
    .then(([agg, quality]) => {
      if (quality && !quality.quality && quality.n_docs == null) quality = null;
      // normalize index file shape
      if (quality && quality.quality && !quality.n_docs && quality.n_docs !== 0) {
        /* keep */
      }
      render(agg, quality);
    })
    .catch((e) => {
      $("#weekSummary").textContent = "집계를 불러오지 못했습니다.";
      $("#recentList").innerHTML =
        '<li class="insight-empty">데이터 로드 실패: ' +
        esc(String(e.message || e)) +
        "<br><small><code>app/data/dashboard-agg.json</code>이 필요합니다.</small></li>";
    });
})();
</script>
</body>
</html>
